name: Arthashastra KYC Copilot CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  eval-and-security:
    name: Pytest Golden Eval Suite & Static Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Static scan for hardcoded API keys or secrets
        run: |
          python - << 'EOF'
          import pathlib, re, sys

          patterns = [
              re.compile(r"AIza[0-9A-Za-z\-_]{35}"),
              re.compile(r"sk-[A-Za-z0-9]{20,}"),
              re.compile(r"-----BEGIN (RSA |EC )?PRIVATE KEY-----"),
          ]
          violations = []
          for path in pathlib.Path(".").rglob("*"):
              if path.is_dir() or ".git" in path.parts or ".venv" in path.parts:
                  continue
              if path.suffix in {".py", ".tf", ".json", ".md", ".yml", ".yaml", ".env"}:
                  text = path.read_text(encoding="utf-8", errors="ignore")
                  for pat in patterns:
                      if pat.search(text):
                          violations.append(f"{path}: matched {pat.pattern}")
          if violations:
              print("Hardcoded secret pattern detected:", violations)
              sys.exit(1)
          print("Static secret scan passed: zero hardcoded secrets found.")
          EOF

      - name: Run unit tests and 5-case golden evaluation suite
        run: pytest -v

  terraform-validate:
    name: Terraform Format & Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init (no backend) & Validate
        working-directory: infra
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false
          terraform validate
