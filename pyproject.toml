[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-kyc-copilot"
version = "1.0.0"
description = "Arthashastra Agentic KYC & Entity Resolution Copilot built with Google ADK and Google GenAI."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "google-adk>=2.0.0,<3.0.0",
    "google-genai>=2.0.0,<4.0.0",
    "pydantic>=2.10.0,<3.0.0",
    "structlog>=24.4.0,<27.0.0",
    "opentelemetry-sdk>=1.39.0,<2.0.0",
    "google-cloud-secret-manager>=2.20.0,<3.0.0",
    "google-cloud-dlp>=3.20.0,<4.0.0",
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn>=0.34.0,<1.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0,<10.0.0",
    "pytest-asyncio>=0.24.0,<2.0.0",
    "httpx>=0.27.0,<1.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["kyc_copilot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
